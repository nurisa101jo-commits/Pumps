name: Windows Release
permissions:
  contents: write
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    concurrency:
      group: pumps-windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @pumps/desktop build
      - run: pnpm --filter @pumps/desktop package
      - name: Create 1.0.1 tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -fa v1.0.1 "$GITHUB_SHA" -m "Pumps Platform 1.0.1"
          git push origin refs/tags/v1.0.1 --force
      - uses: actions/upload-artifact@v4
        with:
          name: pumps-platform-windows
          path: apps/desktop/release/*
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Pumps Platform 1.0.1
          body: |
            Pumps Platform 1.0.1.

            Fixes Windows desktop startup so the UI does not fail because the local API health check takes longer than 30 seconds.
          files: apps/desktop/release/*
          overwrite_files: true
