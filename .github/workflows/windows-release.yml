name: Windows Release
permissions:
  contents: write
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @pumps/desktop build
      - run: pnpm --filter @pumps/desktop package
      - name: Tag 1.0.0 release
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse v1.0.0 >/dev/null 2>&1; then
            git tag -a v1.0.0 "$GITHUB_SHA" -m "Pumps Platform 1.0.0"
            git push origin v1.0.0
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pumps-platform-windows
          path: apps/desktop/release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Pumps Platform 1.0.0
          body: |
            First complete Windows release of Pumps Platform.

            Includes the Customer Selection Portal, Engineering Admin Portal, hydraulic selection engine, AI-assisted ingestion, catalog/rules management, backups, audit, and Windows desktop packaging.
          files: apps/desktop/release/*
