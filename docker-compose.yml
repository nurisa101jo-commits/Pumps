services:
  postgres:
    image: postgres:16-alpine
    container_name: pumps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pumps
      POSTGRES_USER: pumps
      POSTGRES_PASSWORD: pumps
    ports:
      - "5432:5432"
    volumes:
      - pumps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumps -d pumps"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pumps_postgres_data:
